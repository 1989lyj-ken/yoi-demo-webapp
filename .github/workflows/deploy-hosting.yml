# 階段三：手動部署 Hosting（只部署前端，永遠不動 Firestore Rules）。
# 只能從 GitHub 的 Actions 頁面手動按「Run workflow」觸發；部署前會先跑型別檢查與單元測試。
# 需要的 Secrets（產品負責人在 GitHub 設定，不要寫進任何檔案）：
#   FIREBASE_SA_INTERNAL：yoxi-yoi-demo 專案的服務帳戶金鑰 JSON（角色：Firebase Hosting 管理員）
#   FIREBASE_SA_PUBLIC：  yoi-public-demo 專案的服務帳戶金鑰 JSON（角色：Firebase Hosting 管理員）
# 需要的 Variables（FSD-PA-10 Yoika，設在 Environments → public-demo → Variables；都是公開值，會出現在網頁裡）：
#   VITE_YOIKA_API_KEY、VITE_YOIKA_PROJECT_ID、VITE_YOIKA_APP_ID、VITE_YOIKA_MESSAGING_SENDER_ID、VITE_YOIKA_RECAPTCHA_SITE_KEY
#   缺任何一個就中止部署，避免把「Yoika 準備中」的版本推上線。App Check 偵錯權杖是機密，永遠不放這裡。
name: Deploy Hosting

on:
  workflow_dispatch:
    inputs:
      target:
        description: 部署哪個網站
        type: choice
        required: true
        options:
          - internal
          - public

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 兩個環境在 GitHub Environments 限定只允許 main 分支，並設 Required reviewers：部署前須由產品負責人核准（repo 已於 2026-10-14 改為公開）。
    environment: ${{ inputs.target == 'public' && 'public-demo' || 'internal-demo' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安裝相依
        run: npm ci

      - name: 型別檢查與單元測試
        run: |
          npx tsc --noEmit
          npm test

      - name: 建置內部展示版
        if: inputs.target == 'internal'
        run: npm run build

      - name: 建置公開測試版（含 Yoika 設定）
        if: inputs.target == 'public'
        env:
          VITE_YOIKA_API_KEY: ${{ vars.VITE_YOIKA_API_KEY }}
          VITE_YOIKA_PROJECT_ID: ${{ vars.VITE_YOIKA_PROJECT_ID }}
          VITE_YOIKA_APP_ID: ${{ vars.VITE_YOIKA_APP_ID }}
          VITE_YOIKA_MESSAGING_SENDER_ID: ${{ vars.VITE_YOIKA_MESSAGING_SENDER_ID }}
          VITE_YOIKA_RECAPTCHA_SITE_KEY: ${{ vars.VITE_YOIKA_RECAPTCHA_SITE_KEY }}
        run: |
          for name in VITE_YOIKA_API_KEY VITE_YOIKA_PROJECT_ID VITE_YOIKA_APP_ID VITE_YOIKA_MESSAGING_SENDER_ID VITE_YOIKA_RECAPTCHA_SITE_KEY; do
            if [ -z "${!name}" ]; then echo "缺少 Variable：$name（Environments → public-demo → Variables）" >&2; exit 1; fi
          done
          if [ "$VITE_YOIKA_PROJECT_ID" != "yoi-public-demo" ]; then echo "VITE_YOIKA_PROJECT_ID 必須是 yoi-public-demo" >&2; exit 1; fi
          npm run build:public
          grep -q "$VITE_YOIKA_APP_ID" dist-public/assets/*.js || { echo "建置結果沒有 Yoika 設定" >&2; exit 1; }

      - name: 寫入服務帳戶憑證（只存在 runner 暫存區）
        env:
          SA_JSON: ${{ inputs.target == 'public' && secrets.FIREBASE_SA_PUBLIC || secrets.FIREBASE_SA_INTERNAL }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "缺少服務帳戶 Secret" >&2; exit 1; fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 部署內部展示版（只有 hosting）
        if: inputs.target == 'internal'
        run: npx firebase deploy --only hosting --project yoxi-yoi-demo --non-interactive

      - name: 部署公開測試版（只有 hosting）
        if: inputs.target == 'public'
        run: npx firebase deploy --only hosting --project yoi-public-demo --config firebase.public.json --non-interactive

      - name: 清除憑證
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
