# 階段一：每次 push / PR 自動檢查型別、單元測試與兩個版本的建置。不連雲端、不需要任何 Secrets。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安裝相依
        run: npm ci

      - name: 型別檢查
        run: npx tsc --noEmit

      - name: 單元測試
        run: npm test

      - name: 建置內部展示版
        run: npm run build

      - name: 建置公開測試版
        run: npm run build:public

  # 階段二：在 Firestore Emulator 跑 Rules 測試（只在 runner 本機，不連雲端）。
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: 快取 Firestore Emulator JAR
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-1.22.0

      - name: 安裝相依
        run: npm ci

      - name: Rules 測試
        run: bash scripts/test-firestore-rules-ci.sh
